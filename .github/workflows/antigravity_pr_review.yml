name: Antigravity PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Runs on all PRs by default. You can restrict to specific branches if needed.

# Explicitly set permissions for the GITHUB_TOKEN to ensure least privilege (Security Best Practice)
permissions:
  contents: read
  pull-requests: write # Required to post review comments on the PR

jobs:
  review:
    name: Code Review with Antigravity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    # Optional: Prevent concurrent reviews on the same PR to save resources and avoid duplicate comments
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to accurately compare base and head branches

      - name: Setup Antigravity
        run: |
          # Install the Antigravity CLI (agy)
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          # Add the installation directory to GITHUB_PATH so agy is available in subsequent steps
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Antigravity Review
        env:
          # Securely provide the Google AI Studio API Key
          # Google AI Studio keys typically use the GEMINI_API_KEY environment variable.
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do NOT use untrusted variables like ${{ github.head_ref }} directly in inline scripts 
          # to prevent script injection. Pass them via environment variables instead.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Fetch the base branch to ensure we have the commits to compare against
          git fetch origin $BASE_REF:refs/remotes/origin/$BASE_REF
          
          # Run the Antigravity CLI in non-interactive print mode
          # We provide a prompt to ensure it acts like a senior developer code review.
          agy --print "Act as an expert senior developer. Please perform a thorough code review of the diff between origin/$BASE_REF and HEAD. Provide actionable feedback, point out potential bugs, and suggest improvements. Format your response in markdown." > review.md
          
          # Post the review as a comment on the GitHub PR
          # We attempt to create a formal PR Review first, and fallback to a normal PR comment if that fails.
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr review $PR_NUMBER --comment --body-file review.md || gh pr comment $PR_NUMBER --body-file review.md
