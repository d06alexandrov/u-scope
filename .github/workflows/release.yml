name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          target-branch: 'main'

  build-app:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/app_build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      pull-requests: write

  upload-release-assets:
    needs: [release-please, build-app]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: u-scope-linux
          path: release-assets/linux/u-scope

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: u-scope-win64
          path: release-assets/win64/u-scope

      - name: Package Linux Binary
        run: tar -czvf u-scope-linux.tar.gz -C release-assets/linux u-scope

      - name: Package Windows Binary
        run: |
          cd release-assets/win64/
          zip -r ../../u-scope-win64.zip u-scope/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            u-scope-linux.tar.gz
            u-scope-win64.zip
