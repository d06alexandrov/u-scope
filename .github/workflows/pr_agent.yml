name: PR Agent (Gemini)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: >
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@85178bef87b7a03081cd30592a5aad100284f9a7 # v0.37.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.ai_timeout: ${{ vars.GEMINI_AI_TIMEOUT }}
          config.model: "gemini/${{ vars.GEMINI_MODEL }}"
          config.fallback_models: '["gemini/${{ vars.GEMINI_FALLBACK_MODEL }}"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"

          config.allow_dynamic_context: "true"
          pr_description.publish_description_as_comment: "true"
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.extra_instructions: |
            You are a strict Principal C++/Qt Architect. Perform a comprehensive code review with the following focus areas:
            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability
            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic
            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues
            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios
            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy
            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.

          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_code_suggestions.ask_and_reflect: "true"
#          pr_code_suggestions.extra_instructions: |
#           - Focus exclusively on fixing memory leaks, Qt signal/slot thread affinity bugs, and removing unnecessary deep copies.
#            - Do not suggest stylistic changes.
#            - CRITICAL: You must preserve the exact original indentation and whitespace of the code.
#            - NEVER add, remove, or modify leading spaces, tabs, or padding on the modified lines or the surrounding context lines.
#            - Do not attempt to fix or standardize indentation unless the explicit purpose of the PR is to fix formatting.
#            - Match the exact spacing of the original file down to the character.
