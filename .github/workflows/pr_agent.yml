name: PR Agent (Gemini)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: >
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@85178bef87b7a03081cd30592a5aad100284f9a7 # v0.37.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.ai_timeout: ${{ vars.GEMINI_AI_TIMEOUT }}
          config.model: "gemini/${{ vars.GEMINI_MODEL }}"
          config.fallback_models: '["gemini/${{ vars.GEMINI_FALLBACK_MODEL }}"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"

          config.allow_dynamic_context: "true"
          pr_description.publish_description_as_comment: "true"
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.extra_instructions: |
            You are a strict Principal C++/Qt Architect. Review this PR using the following rule set. If none of these rules are violated, do NOT leave nitpick comments.
            ### 1. MEMORY & LIFECYCLE (CRITICAL)
            - **Rule M1:** Flag any raw `new`/`delete` calls. Suggest `std::make_unique` or `std::make_shared`.
            - **Rule M2 (Qt):** If a `QObject` is allocated on the heap, verify it has a parent passed to its constructor, OR that it is explicitly added to a layout/scene, OR managed by a smart pointer. Flag unparented `QObject` pointers as memory leaks.
            - **Rule M3:** Check for dangling references in lambda captures (e.g., capturing `this` by reference in an asynchronous Qt concurrent call or delayed signal).
            ### 2. QT-SPECIFIC ARCHITECTURE
            - **Rule Q1:** Strictly enforce Modern PMF (Pointer-to-Member-Function) syntax for signals and slots. Flag any use of the legacy `SIGNAL()` and `SLOT()` string macros.
            - **Rule Q2:** Flag blocking calls (e.g., `QThread::sleep()`, heavy synchronous I/O) running on the GUI / Main Thread.
            - **Rule Q3:** When passing strings to Qt APIs, enforce `QStringView` or `QLatin1String` where possible to prevent hidden deep-copy allocations of `QString`.
            ### 3. C++ MODERNIZATION & PERFORMANCE
            - **Rule P1:** Flag large objects passed by value. Suggest `const &`.
            - **Rule P2:** Ensure overriding virtual methods explicitly use the `override` keyword.
            - **Rule P3:** Check that STL algorithms (e.g., `std::find_if`, `std::transform`) are preferred over raw `for`-loops where applicable.
            ### 4. BEHAVIORAL CONSTRAINTS
            - Ignore all code formatting, indentation, and bracket placement (assume `clang-format` is used).
            - Ignore variable naming conventions.
            - If you suggest a code change, you MUST provide a compiled-checked snippet.

          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_code_suggestions.ask_and_reflect: "true"
#          pr_code_suggestions.extra_instructions: |
#           - Focus exclusively on fixing memory leaks, Qt signal/slot thread affinity bugs, and removing unnecessary deep copies.
#            - Do not suggest stylistic changes.
#            - CRITICAL: You must preserve the exact original indentation and whitespace of the code.
#            - NEVER add, remove, or modify leading spaces, tabs, or padding on the modified lines or the surrounding context lines.
#            - Do not attempt to fix or standardize indentation unless the explicit purpose of the PR is to fix formatting.
#            - Match the exact spacing of the original file down to the character.
